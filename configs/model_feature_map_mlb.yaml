core_theory_families:
  penalized_glm:
    status: active_default
    model_keys:
    - glm_ridge
    - glm_elastic_net
    - glm_lasso
    note: Executable CAS-core penalized GLMs stay in the default MLB theory lane.
  lasso_credibility:
    status: active_opt_in
    model_keys:
    - glm_lasso_market_credibility
    - glm_lasso_prior_credibility
    note: Trainable opt-in credibility variants stay explicit in the core lane without entering the default run list.
comparison_reporting_profiles:
  theory_core_default:
    lane: core
    classification: core-supported
    champion_eligible: true
    report_priority: 1
    model_keys:
    - glm_ridge
    - glm_elastic_net
    - glm_lasso
    - glm_vanilla
    note: Default production/theory-core slate. Extension and experimental challengers require explicit opt-in.
  theory_core_opt_in:
    lane: core
    classification: direct_theory_implementation
    champion_eligible: true
    report_priority: 2
    model_keys:
    - glm_lasso_market_credibility
    - glm_lasso_prior_credibility
    note: Credibility variants stay visible as opt-in comparison rows separate from the default slate.
  baseline_references:
    lane: baseline
    classification: theory_compatible_engineering_support
    champion_eligible: false
    report_priority: 4
    model_keys:
    - elo_baseline
    - dynamic_rating
    - simulation_first
    note: Baseline rows provide stability context and should not be promoted by default.
  theory_compatible_extensions:
    lane: extension
    classification: theory-compatible extension
    champion_eligible: false
    report_priority: 3
    model_keys:
    - gam_spline
    - glmm_logit
    - dglm_margin
    - goals_poisson
    note: GLM-adjacent extension rows are traceable but stay outside the default theory-core production lane.
  experimental_challengers:
    lane: experimental
    classification: experimental_challenger
    champion_eligible: false
    report_priority: 5
    model_keys:
    - mars_hinge
    - two_stage
    - gbdt
    - rf
    - bayes_bt_state_space
    - bayes_goals
    - nn_mlp
    note: Non-CAS and proxy challengers remain opt-in and must be reported as challenger-only rows.
